{% extends "library/base.html" %}
{% block title %}Import books - Shelf-School{% endblock %}
{% block content %}
<section class="csv-import">
  <header class="csv-import-heading"><div><h1>Import books</h1><p class="muted">One physical copy per row. UTF-8 CSV.</p></div><a class="button" href="{% url 'download_csv_template' 'books' %}"><i data-lucide="download" aria-hidden="true"></i>Download CSV template</a></header>
  <form class="csv-upload" method="post" enctype="multipart/form-data">
    {% csrf_token %}{{ form.as_p }}
    <button class="button primary"><i data-lucide="upload" aria-hidden="true"></i>Import books</button>
  </form>
  {% include "library/csv_field_reference.html" %}
</section>
{% endblock %}
