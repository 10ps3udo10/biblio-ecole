{% extends "library/base.html" %}
{% block title %}School settings - Shelf-School{% endblock %}
{% block content %}
<section class="hero compact">
  <div><h1>School settings</h1><p class="muted">Configure this installation for one school.</p></div>
  <div class="actions"><a class="button" href="{% url 'backup_sqlite' %}">Download database backup</a><a class="button" href="{% url 'admin:auth_user_changelist' %}">Manage users</a><a class="button" href="{% url 'admin:index' %}">Django admin</a></div>
</section>
<section class="form-panel settings-panel">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button primary">Save school settings</button>
  </form>
</section>
{% endblock %}
